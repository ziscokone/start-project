{# Aide à l'installation sur iPhone / iPad : Safari n'a pas de bouton « Installer ». #}
<div class="modal fade" id="aide-installation" tabindex="-1" aria-labelledby="aide-installation-titre" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0" style="border-radius:16px">
            <div class="modal-body p-4 text-center">
                <span class="icone-boite icone-boite-orange mb-3" style="width:56px;height:56px;font-size:1.5rem;border-radius:14px"><i class="bi bi-phone"></i></span>
                <h2 class="h6 fw-bold mb-3" id="aide-installation-titre">Installer l'application</h2>
                <ol class="text-start small mb-4 ps-3" style="line-height:1.9">
                    <li>Touchez <i class="bi bi-box-arrow-up text-primary"></i> <strong>Partager</strong> en bas de Safari</li>
                    <li>Choisissez <i class="bi bi-plus-square"></i> <strong>Sur l'écran d'accueil</strong></li>
                    <li>Touchez <strong>Ajouter</strong></li>
                </ol>
                <button type="button" class="btn btn-accent w-100" data-bs-dismiss="modal">J'ai compris</button>
            </div>
        </div>
    </div>
</div>
