{% extends "layouts/page.html" %}

{% block title %}{{ titre }}{% endblock %}

{% block content %}
<div class="page-erreur">
    <div class="carte carte-corps px-5 py-5" style="max-width:480px">
        <span class="icone-boite icone-boite-orange"><i class="bi {{ icone }}"></i></span>
        <div class="code">{{ code }}</div>
        <h2 class="h4 fw-bold mt-2">{{ titre }}</h2>
        <p class="text-muted mb-4">{{ texte }}</p>
        <a href="{% url 'hub' %}" class="btn btn-primary"><i class="bi bi-house me-1"></i> Retour à l'accueil</a>
    </div>
</div>
{% endblock %}
